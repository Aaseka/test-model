# For IT. Start:  docker compose up -d
# Users open:     http://<server>:8000
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - HOST=0.0.0.0
      - LOG_FILE=/app/logs/question_log.jsonl
    volumes:
      - ./logs:/app/logs
