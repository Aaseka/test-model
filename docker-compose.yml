# For IT. Start:  docker compose up -d
# Then once:      docker compose exec ollama ollama pull qwen3-vl:8b
# Users open:     http://<server>:8000
services:
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=4
    # Uses the server's NVIDIA GPU. Delete these 6 lines to run on CPU only (much slower).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  app:
    build: .
    restart: unless-stopped
    depends_on: [ollama]
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - HOST=0.0.0.0
      - LOG_FILE=/app/logs/question_log.jsonl
    volumes:
      - ./logs:/app/logs

volumes:
  ollama_models:
